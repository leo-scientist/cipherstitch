[project]
name = "cipherstitch"
version = "0.1.0"
description = "Hide files inside images, audio, documents and text, with optional authenticated encryption."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/README.ijg"]
authors = [{ name = "Yurii Kit" }]
keywords = ["steganography", "encryption", "lsb", "dct", "jpeg", "audio", "pdf", "docx", "argon2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography==50.0.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "zxcvbn==4.5.0",
]

[project.urls]
Repository = "https://github.com/leo-scientist/cipherstitch"
Documentation = "https://github.com/leo-scientist/cipherstitch/tree/main/docs"

[project.scripts]
ciphst = "cipherstitch.cli:main"

[project.gui-scripts]
ciphst-gui = "cipherstitch.gui:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials==6.12.0",
]
crypto-extra = [
    "pynacl==1.6.2",
]
audio = [
    "soundfile==0.14.0",
]
documents = [
    "pikepdf==10.17.0",
    "python-docx==1.2.0",
]
jpeg = [
    "jpeglib==1.0.2",
]
ecc = [
    "reedsolo==1.7.0",
]
raw = [
    "rawpy==0.28.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The release art and the detectability study stay in the repository only.
exclude = ["assets", "benchmarks", ".github", ".idea"]

[dependency-groups]
# What the suite needs on a core-only install (make test-core, CI's core-only job).
test = [
    "coverage-conditional-plugin==0.9.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]
dev = [
    { include-group = "test" },
    "mypy==2.4.1",
    "pytest-qt==4.5.0",
    "ruff==0.17.4",
    "cipherstitch[gui,crypto-extra,audio,documents,jpeg,ecc,raw]",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PTH", "RUF"]
# Typography copied verbatim from the design (CipherStitch).
allowed-confusables = ["–", "×", "−", "’", "σ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The study's scripts run fixed tools and fetch fixed URLs.
"benchmarks/**" = ["S310", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["pytestqt.*", "jpeglib.*", "soundfile.*", "reedsolo.*", "zxcvbn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cipherstitch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
plugins = ["coverage_conditional_plugin"]

# Modules that run only with an optional extra: a core-only install leaves them out.
[tool.coverage.coverage_conditional_plugin.omit]
"not is_installed('PySide6')" = "*/cipherstitch/gui/*"
"not is_installed('nacl')" = "*/cipherstitch/ciphers/xchacha20.py"
"not is_installed('jpeglib')" = ["*/cipherstitch/media/jpeg.py", "*/cipherstitch/methods/dct.py"]
"not is_installed('reedsolo')" = [
    "*/cipherstitch/methods/ecc.py",
    "*/cipherstitch/methods/phase.py",
    "*/cipherstitch/methods/echo.py",
]
"not is_installed('pikepdf')" = "*/cipherstitch/media/pdf.py"
"not is_installed('docx')" = "*/cipherstitch/methods/whitespace.py"
"not is_installed('rawpy')" = "*/cipherstitch/media/raw.py"

[tool.coverage.coverage_conditional_plugin.rules]  # required by the plugin, even if empty

[tool.uv.sources]
cipherstitch = { workspace = true }
